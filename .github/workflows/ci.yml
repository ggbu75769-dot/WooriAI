name: CI

on:
  pull_request:
  push:
    branches:
      - master

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wooriai_dev
          POSTGRES_USER: wooriai
          POSTGRES_PASSWORD: wooriai_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wooriai -d wooriai_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://wooriai:wooriai_dev_password@localhost:5432/wooriai_dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check example env
        run: pnpm check:env:example

      - name: Prisma migrate deploy
        run: pnpm --filter api prisma:deploy

      - name: Prisma seed
        run: pnpm --filter api seed

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build dry-run
        run: pnpm build
