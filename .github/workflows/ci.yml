name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: wooriai_dev
          POSTGRES_USER: wooriai
          POSTGRES_PASSWORD: wooriai_dev_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wooriai -d wooriai_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://wooriai:wooriai_dev_password@localhost:5432/wooriai_dev
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Environment contract
        run: pnpm check:env:example
      - name: High-confidence secret scan
        run: pnpm security:secrets
      - name: Production dependency vulnerability scan
        run: pnpm security:audit
      - name: License and dependency inventory
        shell: bash
        run: |
          mkdir -p artifacts/security
          pnpm licenses list --prod --json > artifacts/security/licenses.json
          pnpm list -r --prod --json > artifacts/security/pnpm-production-dependencies.json
      - name: Prisma validate and empty-database migration
        run: |
          pnpm --filter api prisma:validate
          pnpm --filter api prisma:deploy
          pnpm --filter api seed
      - name: Contract generation drift
        run: |
          pnpm contracts:generate
          git diff --exit-code -- packages/contracts
      - name: ESLint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit and integration tests
        run: pnpm test --concurrency=1 --force
      - name: API release E2E
        run: pnpm --filter api test:e2e
      - name: Production builds
        env:
          NEXT_STANDALONE: "1"
        run: pnpm build --force
      - name: Production config negative fixture
        shell: bash
        run: |
          if pnpm release:config; then
            echo "placeholder production configuration unexpectedly passed"
            exit 1
          fi
      - name: Production config positive fixture
        run: pnpm release:config:fixture
      - name: Artifact checksums
        shell: bash
        run: |
          find apps/api/dist apps/admin/.next apps/mobile/dist -type f -print0 \
            | sort -z \
            | xargs -0 sha256sum > release-build-sha256.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-build-manifest
          path: |
            release-build-sha256.txt
            docs/qa/evidence/release3-production-config-*.json
            artifacts/security/*.json

  android-compile:
    runs-on: ubuntu-latest
    needs: quality-and-integration
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: pnpm
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Android release-like compile
        run: pnpm pixel:android:build-apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-release-like-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            artifacts/pixel-lock/android/reports/pixel-apk.json

  container-security:
    runs-on: ubuntu-latest
    needs: quality-and-integration
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build production images
        run: |
          docker build -f infra/docker/api.Dockerfile -t wooriai-api:ci .
          docker build -f infra/docker/admin.Dockerfile -t wooriai-admin:ci .
      - name: Trivy high and critical scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed wooriai-api:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.61.0 image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed wooriai-admin:ci
