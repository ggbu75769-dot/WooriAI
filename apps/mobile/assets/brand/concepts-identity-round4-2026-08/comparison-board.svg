<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 2220">
  <rect width="1600" height="2220" fill="#F3F0EB"/>
  <style>
    .ko{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
    .title{font-size:60px;font-weight:900;fill:#151A20;letter-spacing:-2px}
    .sub{font-size:24px;font-weight:500;fill:#66717B;letter-spacing:-.6px}
    .num{font-size:24px;font-weight:900;fill:#FF6B4A}
    .brand{font-size:44px;font-weight:900;fill:#17324D;letter-spacing:-2px}
    .en{font-size:23px;font-weight:900;fill:#151A20;letter-spacing:.2px}
    .desc{font-size:20px;font-weight:500;fill:#747E87;letter-spacing:-.5px}
  </style>
  <text x="70" y="92" class="ko title">우리아이 — 완전 신규 로고 10</text>
  <text x="70" y="138" class="ko sub">기능 아이콘이 아닌 고유 브랜드 마크 · 아이 비용 기록 + 다음 준비 + 가족 보호</text>
  <rect x="70" y="166" width="1460" height="54" rx="27" fill="#17324D"/>
  <circle cx="110" cy="193" r="11" fill="#FF6B4A"/><circle cx="143" cy="193" r="11" fill="#FFD76A"/>
  <text x="174" y="201" class="ko desc" fill="#FFF9F3">OFFICIAL PALETTE ONLY  ·  64PX SILHOUETTE  ·  NO GENERIC UI ICON</text>

  <g transform="translate(58 258)"><rect width="722" height="330" rx="42" fill="#FFFFFF"/>
    <image href="21-nest-ledger.svg" x="28" y="30" width="270" height="270"/>
