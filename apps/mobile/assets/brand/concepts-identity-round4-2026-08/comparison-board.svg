  <text x="800" y="2118" text-anchor="middle" class="ko sub">이번 판 추천: 21 · 25 · 28 — 브랜드 고유성과 서비스 이해도의 균형</text>
  <text x="800" y="2162" text-anchor="middle" class="ko desc">선택 전 단계이며 실제 앱 아이콘·스플래시 자산에는 아직 적용하지 않음</text>
