    <text x="334" y="193" class="ko en">NEST LEDGER</text><text x="334" y="237" class="ko desc">아이를 품은 비용 기록</text><text x="334" y="273" class="ko desc">둥지 + 영수증 + 아이</text>
  </g>
  <g transform="translate(820 258)"><rect width="722" height="330" rx="42" fill="#FFFFFF"/>
