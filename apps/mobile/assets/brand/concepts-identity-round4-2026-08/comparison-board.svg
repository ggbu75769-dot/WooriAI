    <text x="334" y="193" class="ko en">BABY WALLET</text><text x="334" y="237" class="ko desc">우리 아이 전용 가족 지갑</text><text x="334" y="273" class="ko desc">아이 얼굴 + 비용 지갑</text>
  </g>
  <g transform="translate(58 620)"><rect width="722" height="330" rx="42" fill="#FFFFFF"/>
    <image href="23-ready-nest.svg" x="28" y="30" width="270" height="270"/>
