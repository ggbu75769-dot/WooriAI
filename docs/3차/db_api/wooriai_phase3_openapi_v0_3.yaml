components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: EXPENSE_AMOUNT_INVALID
            message:
              type: string
              example: 금액을 다시 확인해주세요.
            details:
              type: object
              additionalProperties: true
            requestId:
              type: string
    MoneyKRW:
      type: integer
      minimum: 1
      example: 49800
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - active
          - withdrawn
          - blocked
    TokenPair:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          example: 1800
    Household:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
          - owner
          - co_parent
          - viewer
          - gift_participant
    Child:
      type: object
      properties:
        id:
          type: string
          format: uuid
        householdId:
          type: string
          format: uuid
        nickname:
          type: string
        stageMode:
          type: string
          enum:
          - pregnant
          - born
          - manual
        dueDate:
          type:
          - string
          - 'null'
          format: date
        birthDate:
          type:
          - string
          - 'null'
          format: date
        manualStage:
          type:
          - string
          - 'null'
        currentStage:
          type: string
          example: pregnancy_late
        stageLabel:
          type: string
          example: 임신 28주차
    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        iconName:
          type: string
    Expense:
      type: object
      required:
      - id
      - childId
      - amountKrw
      - spentOn
      - itemName
      properties:
        id:
          type: string
          format: uuid
        childId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        amountKrw:
          $ref: '#/components/schemas/MoneyKRW'
        spentOn:
          type: string
          format: date
        itemName:
          type: string
          example: 기저귀
        merchant:
          type:
          - string
          - 'null'
        memo:
          type:
          - string
          - 'null'
        expenseType:
          type: string
          enum:
          - expense
          - gift
          - refund
          default: expense
        source:
          type: string
          enum:
          - manual
          - excel_import
          - purchase_followup
          - admin
    CreateExpenseRequest:
      type: object
      required:
      - categoryId
      - amountKrw
      - spentOn
      - itemName
      properties:
        categoryId:
          type: string
          format: uuid
        amountKrw:
          $ref: '#/components/schemas/MoneyKRW'
        spentOn:
          type: string
          format: date
        itemName:
          type: string
          maxLength: 120
        merchant:
          type: string
        paymentMethod:
          type: string
          enum:
          - unknown
          - cash
          - card
          - transfer
          - mobile_pay
          default: unknown
        memo:
          type: string
        linkedItemTemplateId:
          type: string
          format: uuid
    Budget:
      type: object
      properties:
        childId:
          type: string
          format: uuid
        yearMonth:
          type: string
          format: date
          example: '2026-07-01'
        amountKrw:
          $ref: '#/components/schemas/MoneyKRW'
        usedAmountKrw:
          type: integer
        remainingAmountKrw:
          type: integer
    HomeSummary:
      type: object
      properties:
        child:
          $ref: '#/components/schemas/Child'
        totalExpenseKrw:
          type: integer
        monthly:
          $ref: '#/components/schemas/Budget'
        recommendedItems:
          type: array
          items:
            $ref: '#/components/schemas/ItemSummary'
        recentExpenses:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
    ItemSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        necessityLevel:
          type: string
          enum:
          - essential
          - convenience
          - optional
        status:
          type: string
          enum:
          - not_prepared
          - prepared
          - gifted
          - not_needed
          - interested
        timingLabel:
          type: string
        priceBandText:
          type: string
    ItemDetail:
      allOf:
      - $ref: '#/components/schemas/ItemSummary'
      - type: object
        properties:
          reasonText:
            type: string
          skipReasonText:
            type:
            - string
            - 'null'
          usedSecondhandOk:
            type: boolean
          safetyNote:
            type:
            - string
            - 'null'
          productLinks:
            type: array
            items:
              $ref: '#/components/schemas/ProductLink'
    ProductLink:
      type: object
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - coupang
          - naver
          - custom
        title:
          type: string
        isAffiliate:
          type: boolean
        isSponsored:
          type: boolean
        disclosureText:
          type: string
          example: 이 링크로 구매하면 우리아이가 수수료를 받을 수 있어요.
    AffiliateClickResponse:
      type: object
      properties:
        clickId:
          type: string
          format: uuid
        redirectUrl:
          type: string
        disclosureText:
          type: string
    ReportMonthly:
      type: object
      properties:
        childId:
          type: string
          format: uuid
        yearMonth:
          type: string
          format: date
        totalExpenseKrw:
          type: integer
        budgetAmountKrw:
          type:
          - integer
          - 'null'
        categoryTop:
          type: array
          items:
            type: object
    ImportJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - uploaded
          - analyzing
          - preview_ready
          - confirmed
          - failed
          - cancelled
        rowCount:
          type: integer
        candidateCount:
          type: integer
        importedCount:
          type: integer
    ImportRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rowIndex:
          type: integer
        parsedDate:
          type: string
          format: date
        parsedItemName:
          type: string
        parsedAmountKrw:
          type: integer
        categoryId:
          type: string
          format: uuid
        confidence:
          type: number
        selected:
          type: boolean
        validationStatus:
          type: string
  parameters:
    ChildId:
      name: childId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HouseholdId:
      name: householdId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    YearMonth:
      name: yearMonth
      in: query
      required: false
      schema:
        type: string
        pattern: ^\d{4}-\d{2}$
        example: 2026-07
