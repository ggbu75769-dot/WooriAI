version: v0.4
date: '2026-07-05'
acceptance_criteria:
- id: AC-GLOBAL-001
  module: Global
  priority: P0
  criteria: pnpm lint, pnpm typecheck, pnpm test가 통과해야 한다. 실패 시 실패 이유와 미해결 범위를 문서화한다.
- id: AC-GLOBAL-002
  module: Global
  priority: P0
  criteria: 주요 API는 OpenAPI 3.1 문서와 일치해야 한다. 앱은 생성 타입 또는 공유 DTO를 사용한다.
- id: AC-GLOBAL-003
  module: Global
  priority: P0
  criteria: 모든 화면은 Loading, Empty, Data, Error, Offline/Permission 상태 중 필요한 상태를 처리한다.
- id: AC-GLOBAL-004
  module: Global
  priority: P0
  criteria: 한국어 UX 문구는 해요체와 쉬운 표현을 사용한다.
- id: AC-AUTH-001
  module: Auth/Consent
  priority: P0
  criteria: 필수 약관/개인정보 동의 전에는 가입 완료/온보딩 진입이 불가하다.
- id: AC-AUTH-002
  module: Auth/Consent
  priority: P0
  criteria: 토큰은 안전 저장소에 저장하고 refresh/logout이 동작한다.
- id: AC-ONB-001
  module: Onboarding
  priority: P0
  criteria: 신규 사용자는 임신/출산/수동 단계 선택 후 4단계 이하로 HOME-001에 진입한다.
- id: AC-ONB-002
  module: Onboarding
  priority: P0
  criteria: 예정일/생년월일/수동 단계에 따라 child_stage_code가 정확히 계산된다.
- id: AC-HOME-001
  module: Home
  priority: P0
  criteria: 홈은 누적 금액, 이번 달 사용액/예산, 준비템 3~5개, 최근 기록 3개를 표시한다.
- id: AC-HOME-002
  module: Home
  priority: P0
  criteria: 기록 저장/수정/삭제 후 홈 금액이 즉시 갱신된다.
- id: AC-EXP-001
  module: Expense
  priority: P0
  criteria: 품목 선택→금액 입력→저장이 정상 네트워크에서 10초 이내 가능하다.
- id: AC-EXP-002
  module: Expense
  priority: P0
  criteria: 금액은 0보다 큰 정수만 허용하고 미래 날짜는 제한한다.
- id: AC-EXP-003
  module: Expense
  priority: P0
  criteria: 삭제된 지출은 리포트에서 제외되며 audit log에 남는다.
- id: AC-BUD-001
  module: Budget
  priority: P0
  criteria: 월 예산은 아이 프로필 단위로 Asia/Seoul 월 경계 기준 집계된다.
- id: AC-REP-001
  module: Report
  priority: P0
  criteria: 월별/누적/카테고리 총액은 홈 금액과 일치한다. 삭제/선물 기본 제외.
- id: AC-ITEM-001
  module: Items
  priority: P0
  criteria: 현재 아이 단계 기준 준비템이 추천 점수 순으로 노출된다.
- id: AC-ITEM-002
  module: Items
  priority: P0
  criteria: 이미 준비/필요 없음 상태는 지금 필요 탭에서 제외된다.
- id: AC-ITEM-003
  module: Items
  priority: P0
  criteria: 모든 준비템은 필수/편의/선택 중 하나의 등급을 가진다. 선택/편의는 안 사도 되는 경우 설명이 있다.
- id: AC-AFF-001
  module: Affiliate
  priority: P0
  criteria: 구매 링크 클릭 전 또는 CTA 인접 위치에 제휴 고지가 보인다.
- id: AC-AFF-002
  module: Affiliate
  priority: P0
  criteria: 구매 링크 클릭 시 affiliate_clicks 로그가 저장된다.
- id: AC-AFF-003
  module: Affiliate
  priority: P0
  criteria: 추천 순위는 제휴수수료율에 직접 영향받지 않는다.
- id: AC-FAM-001
  module: Family
  priority: P1
  criteria: owner만 가족 초대/삭제가 가능하다. co_parent는 지출 추가 가능, viewer는 리포트 조회만 가능하다.
- id: AC-FAM-002
  module: Family
  priority: P1
  criteria: 초대 수락 후 공동부모가 추가한 지출이 같은 아이 리포트에 반영된다.
- id: AC-IMP-001
  module: Excel Import
  priority: P1
  criteria: xlsx/csv만 허용하고 10MB 또는 2,000행 초과 시 안내한다.
- id: AC-IMP-002
  module: Excel Import
  priority: P1
  criteria: AI 분석 결과는 사용자 승인 전 expenses 테이블에 저장되지 않는다.
- id: AC-IMP-003
  module: Excel Import
  priority: P1
  criteria: 신뢰도 0.70 미만은 기본 미선택이며 중복 후보가 표시된다.
- id: AC-ADM-001
  module: Admin
  priority: P0
  criteria: 관리자는 준비템/상품 링크/고지 문구를 앱 배포 없이 수정할 수 있다.
- id: AC-PRIV-001
  module: Privacy
  priority: P0
  criteria: 계정 삭제, 가구 탈퇴, 아이 프로필 삭제 플로우가 분리되어 있고 영향 범위가 고지된다.
- id: AC-ACCESS-001
  module: Accessibility
  priority: P0
  criteria: 주요 터치 영역은 44px 이상, CTA 권장 높이는 56px이며 고지 문구를 지나치게 작게 숨기지 않는다.
