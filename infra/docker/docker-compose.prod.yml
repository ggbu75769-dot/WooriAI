# 우리아이 API 셀프호스트(단일 VM) 프로덕션 구성 — Fly.io 대신 자체 서버를 쓸 때.
# 사용법: 저장소 루트에서
#   cp .env.example .env.production  (실값 채우기 — docs/5차/day1-deploy-runbook.md §3)
#   docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d --build
name: wooriai-prod

# 로그 로테이션 (OPS-115): API가 요청당 JSON 1줄을 stdout에 기록하므로
# 무제한 json-file 로그는 소용량 VM(Oracle Free) 디스크를 고갈시킬 수 있다.
# 서비스당 최대 10MB × 3파일 = 30MB로 제한.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: wooriai
      POSTGRES_USER: wooriai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - wooriai_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wooriai -d wooriai"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    logging: *default-logging
    command: ["pnpm", "--filter", "api", "prisma:deploy"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://wooriai:${POSTGRES_PASSWORD}@postgres:5432/wooriai
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    restart: unless-stopped
    logging: *default-logging
    env_file:
      - ../../.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://wooriai:${POSTGRES_PASSWORD}@postgres:5432/wooriai
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  wooriai_prod_pg:
