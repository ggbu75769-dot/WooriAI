name: wooriai-local

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: wooriai_dev
      POSTGRES_USER: wooriai
      POSTGRES_PASSWORD: wooriai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - wooriai_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wooriai -d wooriai_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: wooriai-local
      MINIO_ROOT_PASSWORD: change-me-local-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wooriai_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://wooriai:wooriai_dev_password@postgres:5432/wooriai_dev
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: wooriai-local
      S3_ACCESS_KEY_ID: wooriai-local
      S3_SECRET_ACCESS_KEY: change-me-local-only
      JWT_ACCESS_SECRET: change-me-local-only-access
      JWT_REFRESH_SECRET: change-me-local-only-refresh
      WOORIAI_ADMIN_TOKEN: dev-admin-token
      AFFILIATE_ALLOWED_DOMAINS: coupang.com,link.coupang.com,smartstore.naver.com,shopping.naver.com,brand.naver.com
      AFFILIATE_CLICK_IP_SALT: change-me-local-only
      ANALYTICS_ANON_SALT: change-me-local-only
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  admin:
    build:
      context: ../..
      dockerfile: infra/docker/admin.Dockerfile
    environment:
      ADMIN_API_PROXY_TARGET: http://api:3000
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_started

  publisher:
    build:
      context: ../..
      dockerfile: infra/docker/publisher.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://wooriai:wooriai_dev_password@postgres:5432/wooriai_dev
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-local-only-access
      JWT_REFRESH_SECRET: change-me-local-only-refresh
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://wooriai:wooriai_dev_password@postgres:5432/wooriai_dev
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: change-me-local-only-access
      JWT_REFRESH_SECRET: change-me-local-only-refresh
      PRIVACY_PROCESSOR_MODE: mock
      NOTIFICATION_PROVIDER_MODE: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  wooriai_postgres_data:
  wooriai_minio_data:
