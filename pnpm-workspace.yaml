packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true

# Keep transitive security fixes scoped to consumers verified against their APIs.
overrides:
  '@nestjs/platform-express>multer': 2.4.0
  'next>postcss': 8.5.28
  '@expo/metro-config>postcss': 8.5.28
  '@prisma/config>deepmerge-ts': 8.0.2
  'exceljs>uuid': 11.1.1
  'xcode>uuid': 11.1.1
  'next>sharp': 0.35.4
  # SDK 54 pins these Metro packages together. 0.83.8 removes vulnerable image-size.
  '@expo/metro>metro': 0.83.8
  '@expo/metro>metro-core': 0.83.8
  '@expo/metro>metro-cache': 0.83.8
  '@expo/metro>metro-config': 0.83.8
  '@expo/metro>metro-runtime': 0.83.8
  '@expo/metro>metro-file-map': 0.83.8
  '@expo/metro>metro-resolver': 0.83.8
  '@expo/metro>metro-cache-key': 0.83.8
  '@expo/metro>metro-source-map': 0.83.8
  '@expo/metro>metro-symbolicate': 0.83.8
  '@expo/metro>metro-minify-terser': 0.83.8
  '@expo/metro>metro-transform-worker': 0.83.8
  '@expo/metro>metro-babel-transformer': 0.83.8
  '@expo/metro>metro-transform-plugins': 0.83.8
  'brace-expansion@1.1.15': 1.1.21
  'brace-expansion@2.1.1': 2.1.7
  'undici@6.27.0': 6.28.1
  'js-yaml@3.15.0': 3.15.2
  'js-yaml@4.3.0': 4.3.2
  'nanoid@3.3.15': 3.3.19
  'browserslist@4.28.4': 4.29.0
  '@xmldom/xmldom@0.9.10': 0.9.12
  'joi@17.13.4': 17.13.8

patchedDependencies:
  'decode-uri-component@0.2.2': patches/decode-uri-component@0.2.2.patch
