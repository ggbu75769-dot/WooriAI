packages:
  - "apps/*"
  - "packages/*"

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true

overrides:
  '@xmldom/xmldom': 0.8.13
  multer: 2.2.0
  react: 18.3.1
  react-dom: 18.3.1
  react-native-screens: 4.4.0
  tar: 7.5.11
