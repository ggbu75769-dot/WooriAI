packages:
  - "apps/*"
  - "packages/*"

# Keep native CMake object paths below Windows' 250-character Ninja limit.
virtualStoreDir: .pnpm-vstore
virtualStoreDirMaxLength: 30

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - sharp
allowBuilds:
  '@nestjs/core': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true

overrides:
  '@aws-sdk/credential-provider-ini': 3.973.3
  '@aws-sdk/credential-provider-login': 3.972.65
  '@aws-sdk/credential-provider-node': 3.972.69
  '@smithy/core': 3.29.4
  '@smithy/credential-provider-imds': 4.4.9
  '@smithy/fetch-http-handler': 5.6.6
  '@smithy/node-http-handler': 4.9.6
  '@smithy/signature-v4': 5.6.5
  '@xmldom/xmldom': 0.8.13
  body-parser: 1.20.6
  brace-expansion: 5.0.9
  fast-xml-parser: 5.7.0
  fast-uri: 3.1.5
  file-type: 21.3.4
  multer: 2.2.0
  'js-yaml@3': 3.15.1
  'js-yaml@4': 4.3.1
  nanoid: 3.3.17
  postcss: 8.5.23
  qs: 6.15.2
  '@types/react-test-renderer>@types/react': 19.1.17
  sharp: 0.35.3
  tar: 7.5.21
  undici: 6.28.0
  uuid: 11.1.1

patchedDependencies:
  image-size@1.2.1: patches/image-size@1.2.1.patch
